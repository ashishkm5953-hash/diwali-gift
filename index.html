<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cutiepage: Diwali Edition ✨</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #ff477e;
      --secondary: #ff70a6;
      --accent: #ffd166;
      --deep-bg: #0f051d;
      --card-bg: rgba(255, 255, 255, 0.08);
      --text-color: #fff0f3;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--deep-bg);
      color: var(--text-color);
      font-family: 'Poppins', sans-serif;
      overflow-x: hidden;
      position: relative;
      min-height: 100vh;
    }

    .bg-glow {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at 50% 20%, rgba(255, 112, 166, 0.15), rgba(15, 5, 29, 0.85));
      z-index: -1;
    }

    canvas#fireworks {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      position: relative;
      z-index: 2;
    }

    header {
      text-align: center;
      padding: 40px 0 20px;
    }

    header h1 {
      font-family: 'Cinzel', serif;
      font-size: 2.2rem;
      color: var(--accent);
      text-shadow: 0 0 15px rgba(255, 209, 102, 0.4);
      margin-bottom: 10px;
    }

    header p {
      font-size: 1.1rem;
      color: var(--secondary);
      font-style: italic;
    }

    .section-title {
      text-align: center;
      font-family: 'Cinzel', serif;
      font-size: 1.6rem;
      color: var(--accent);
      margin: 40px 0 20px;
    }

    .polaroid-gallery {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
    }

    .polaroid {
      background: #ffffff;
      padding: 15px 15px 25px 15px;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      max-width: 320px;
      width: 100%;
      transform: rotate(-2deg);
      transition: transform 0.3s ease;
    }

    .polaroid:nth-child(even) {
      transform: rotate(2deg);
    }

    .polaroid:hover {
      transform: scale(1.03) rotate(0deg);
    }

    .polaroid img {
      width: 100%;
      height: 380px;
      object-fit: cover;
      border-radius: 4px;
    }

    .polaroid p {
      text-align: center;
      color: #333333;
      font-family: 'Cinzel', serif;
      font-size: 1.1rem;
      margin-top: 15px;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="bg-glow"></div>
  <canvas id="fireworks"></canvas>

  <div class="container">
    <header>
      <h1>HAPPY DIWALI, MY LOVE ✨</h1>
      <p>You light up my world brighter than a million diyas</p>
    </header>

    <h2 class="section-title">OUR UNFORGETTABLE MOMENTS</h2>

    <div class="polaroid-gallery">
      <!-- Moment 1 -->
      <div class="polaroid">
        <img src="photo1.jpg" alt="My fav smile">
        <p>My fav smile ❤️</p>
      </div>

      <!-- Moment 2 -->
      <div class="polaroid">
        <img src="photo2.jpg" alt="Baby">
        <p>Baby ✨</p>
      </div>

      <!-- Moment 3 -->
      <div class="polaroid">
        <img src="photo3.jpg" alt="Comfortable place">
        <p>Comfortable place 🌙</p>
      </div>
    </div>
  </div>

</body>
</html>
