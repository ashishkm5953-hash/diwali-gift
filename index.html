<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cutiepage: Diwali Edition ✨</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #ff477e;
      --secondary: #ff70a6;
      --accent: #ffd166;
      --deep-bg: #0f051d;
      --card-bg: rgba(255, 255, 255, 0.08);
      --text-color: #fff0f3;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--deep-bg);
      color: var(--text-color);
      font-family: 'Poppins', sans-serif;
      overflow-x: hidden;
      position: relative;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      position: relative;
      z-index: 2;
    }

    header {
      text-align: center;
      padding: 40px 0 20px;
    }

    header h1 {
      font-family: 'Cinzel', serif;
      font-size: 2.2rem;
      color: var(--accent);
      text-shadow: 0 0 15px rgba(255, 205, 102, 0.4);
      margin-bottom: 10px;
    }

    header p {
      font-size: 1.1rem;
      color: var(--secondary);
      font-style: italic;
    }

    .section-title {
      text-align: center;
      font-family: 'Cinzel', serif;
      font-size: 1.8rem;
      color: var(--accent);
      margin: 40px 0 20px;
    }

    .polaroid {
      background: white;
      padding: 15px 15px 25px 15px;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      margin: 30px auto;
      max-width: 320px;
      transform: rotate(-2deg);
      transition: transform 0.3s ease;
    }

    .polaroid:nth-child(even) {
      transform: rotate(2deg);
    }

    .polaroid img {
      width: 100%;
      height: 380px;
      object-fit: cover;
      border-radius: 4px;
    }

    .polaroid p {
      text-align: center;
      color: #333;
      font-family: 'Cinzel', serif;
      font-size: 1.1rem;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>HAPPY DIWALI, MY LOVE ✨</h1>
      <p>You light up my world brighter than a million dijas</p>
    </header>

    <h2 class="section-title">OUR UNFORGETTABLE MOMENTS</h2>

    <!-- Moment 1 -->
    <div class="polaroid">
      <img src="photo1.jpg" alt="Our favorite smile">
      <p>My fav smile ❤️</p>
    </div>

    <!-- Moment 2 -->
    <div class="polaroid">
      <img src="photo2.jpg" alt="Endless conversations">
      <p>Baby ✨</p>
    </div>

    <!-- Moment 3 -->
    <div class="polaroid">
      <img src="photo3.jpg" alt="My safe place">
      <p>Comfortable place 🌙</p>
    </div>
  </div>

</body>
</html>
